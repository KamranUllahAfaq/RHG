version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: royal-hostel-db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  web:
    build: .
    container_name: royal-hostel-web
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mongodb://mongodb:27017/royal_hostel?authSource=admin
      - PORT=3000
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongodb_data:
